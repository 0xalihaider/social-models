<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xalihaider // Social Models</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --cobalt: #0044ff;
        --cyber-yellow: #ffde59;
        --hot-pink: #ff007a;
        --void-black: #0f0f13;
      }

      body {
        background-color: var(--cobalt);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        font-family: "Space Mono", monospace;
        padding: 40px 20px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 1. Semantic Landmark Wrapper */
      main {
        width: 100%;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .isekai-header {
        font-family: "Anton", Impact, sans-serif;
        color: #ffffff;
        text-transform: uppercase;
        font-size: 3rem;
        -webkit-text-stroke: 2px #000000;
        letter-spacing: 2px;
        text-align: center;
        margin-bottom: 40px;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
        width: 100%;
      }

      .isekai-card {
        background-color: #ffffff;
        border: 3px solid #000000;
        border-bottom: 8px solid #000000;
        border-right: 8px solid #000000;
        padding: 24px;
        text-decoration: none;
        color: #000000;
        display: block;
        transition: all 0.1s ease-in-out;
        position: relative;
      }

      /* 2. Keyboard Navigation: Shared Hover & Focus-Visible State */
      .isekai-card:hover,
      .isekai-card:focus-visible {
        transform: translate(4px, 4px);
        border-bottom: 4px solid #000000;
        border-right: 4px solid #000000;
        background-color: var(--cyber-yellow);
        outline: none; /* Removed default browser ring */
      }

      /* High-contrast explicit focus indicator for keyboard users */
      .isekai-card:focus-visible {
        box-shadow:
          0 0 0 4px var(--cobalt),
          0 0 0 8px var(--cyber-yellow);
      }

      .card-title {
        font-family: "Anton", Impact, sans-serif;
        font-size: 1.8rem;
        text-transform: uppercase;
        margin: 0 0 10px 0;
      }

      .card-desc {
        font-size: 1rem;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      /* 3. Contrast Compliance Overrides */
      .tech-tag {
        background-color: var(--hot-pink);
        color: #000000; /* Override: Black text instead of white for WCAG AA compliance */
        padding: 4px 8px;
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase;
        border: 2px solid #000000;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main aria-label="Social Models Directory">
      <h1 class="isekai-header">S-TIER DEVELOPER // MODELS</h1>

      <nav aria-label="Models Navigation" class="grid-container">
        <a href="./booleanOperations/index.html" class="isekai-card">
          <h2 class="card-title">Boolean Operations</h2>
          <p class="card-desc">
            Interactive mental model for logical operators and bitwise gates.
          </p>
          <span class="tech-tag" aria-hidden="true">HTML/JS</span>
          <span
            class="sr-only"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              padding: 0;
              margin: -1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
              border-width: 0;
            "
            >Built with HTML and JS</span
          >
        </a>

        <!-- <a href="./js-runtime-model/index.html" class="isekai-card">
          <h2 class="card-title">JS Runtime Model</h2>
          <p class="card-desc">
            Visualizing the call stack, event loop, and task queues.
          </p>
          <span class="tech-tag" aria-hidden="true">ARCHITECTURE</span>
          <span
            class="sr-only"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              padding: 0;
              margin: -1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
              border-width: 0;
            "
            >Category Architecture</span
          >
        </a> -->
      </nav>
    </main>
  </body>
</html>
